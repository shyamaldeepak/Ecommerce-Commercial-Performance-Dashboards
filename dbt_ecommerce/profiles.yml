ecommerce_profile:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "../data/ecommerce.duckdb"
      threads: 4
    prod_snowflake:
      type: snowflake
      account: "xy12345.us-east-1"
      user: "COMMERCIAL_ANALYST"
